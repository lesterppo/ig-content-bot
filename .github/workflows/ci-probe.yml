name: CI probe

# Environment diagnostics. Run this FIRST on any new machine before trusting a
# scheduled run. It never posts anything public: the write probes like/unlike
# and save/unsave the owner's own newest post and undo both immediately.
#
# Jobs:
#   gemini    — do the Gemini cookies work here? can this machine generate an image?
#   instagram — which Instagram surfaces can this machine reach? (read vs write)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gemini:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet gemini-webapi loguru
          .venv/bin/pip install --quiet browser_cookie3 || true
          chmod +x automation/gemini-cli.py

      - name: Refresh cookies from the local browser (self-hosted only)
        continue-on-error: true
        run: .venv/bin/python automation/gemini-cli.py --init --browser firefox

      - name: Gemini account status
        env:
          GEMINI_SID: ${{ secrets.GEMINI_SID }}
          GEMINI_TS: ${{ secrets.GEMINI_TS }}
        run: |
          echo "env cookies present: SID=${#GEMINI_SID} chars TS=${#GEMINI_TS} chars"
          .venv/bin/python automation/gemini-cli.py --account-status || echo "account-status rc=$?"

      - name: Gemini image generation
        env:
          GEMINI_SID: ${{ secrets.GEMINI_SID }}
          GEMINI_TS: ${{ secrets.GEMINI_TS }}
        run: |
          mkdir -p /tmp/probe
          .venv/bin/python automation/gemini-cli.py --img "editorial test portrait, one subject" \
            --save-images /tmp/probe -o /tmp/probe/out || echo "image gen rc=$?"
          ls -la /tmp/probe || true

      - name: NVIDIA models
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: .venv/bin/python scripts/probe_nvidia.py

      - name: Upload generated image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-probe
          path: /tmp/probe/
          if-no-files-found: warn

  instagram:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet -r automation/requirements.txt

      - name: Instagram surface probe
        env:
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_SESSION_JSON: ${{ secrets.IG_SESSION_JSON }}
        run: .venv/bin/python automation/ig_probe.py || echo "ig probe rc=$?"
