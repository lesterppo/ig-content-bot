name: Content bot

# Daily: generate a portrait with web Gemini, post it to Story + Feed, then
# screen new comments/DMs and reply via a free NVIDIA model.
#
# WHERE IT MUST RUN — read AGENTS.md before deploying:
#   Instagram only allows *writes* (feed/story posts, comments, DM replies)
#   from residential/mobile IPs. GitHub-hosted runners (Azure) get
#   login_required / "Please wait a few minutes" on every write; reads like
#   user_medias still work. Deploy a self-hosted runner on a residential
#   connection and set the repo variable CI_RUNNER (e.g. "self-hosted").
#   Without it the job still runs on ubuntu-latest: it generates the image and
#   then logs every Instagram write as failed, instead of crashing.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (log what would be posted/sent, act on nothing)"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      post_to_feed:
        description: "Publish the generated photo to the Feed"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      post_to_story:
        description: "Publish the generated photo to the Story"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      engage:
        description: "Screen and reply to new comments/DMs"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

  schedule:
    # 01:30 UTC = 09:30 HKT, daily. Change it to an hour when the runner
    # (the residential machine) is normally powered on.
    - cron: "30 1 * * *"

concurrency:
  group: content-bot
  cancel-in-progress: false

permissions:
  contents: write  # to commit the bookmark state file back to the repo

jobs:
  content-bot:
    # Repo variable CI_RUNNER selects the runner ("self-hosted" on a
    # residential VM). Unset → ubuntu-latest (generation only, no IG writes).
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet -r automation/requirements.txt
          # hermes-gem-cli deps: web Gemini via cookies (no API key)
          .venv/bin/pip install --quiet gemini-webapi loguru curl_cffi
          chmod +x automation/gemini-cli.py

      - name: Refresh Gemini cookies from the local browser (self-hosted only)
        # Google rotates __Secure-1PSIDTS every time the cookies are used, so a
        # stored secret goes stale. A self-hosted runner whose Firefox/Chrome is
        # signed in to gemini.google.com supplies a fresh jar here; GitHub-hosted
        # runners fall through to the rotating chain below.
        continue-on-error: true
        run: .venv/bin/python automation/gemini-cli.py --init --browser firefox

      - name: Restore Gemini cookie jar (rotating chain)
        uses: actions/cache/restore@v4
        with:
          path: .gemini_cookies.json
          key: gemini-jar-${{ github.run_id }}
          restore-keys: |
            gemini-jar-

      - name: Refresh Gemini cookies for this run
        # picks the newest authenticating jar (browser -> cache -> secrets) and
        # rotates __Secure-1PSIDTS when needed; exports GEMINI_SID/GEMINI_TS to
        # $GITHUB_ENV for the run step below
        continue-on-error: true
        env:
          GEMINI_SID: ${{ secrets.GEMINI_SID }}
          GEMINI_TS: ${{ secrets.GEMINI_TS }}
          GEMINI_COOKIES_JSON: ${{ secrets.GEMINI_COOKIES_JSON }}
        run: .venv/bin/python automation/refresh_cookies.py --out .gemini_cookies.json --emit-env

      - name: Save Gemini cookie jar (rotating chain)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .gemini_cookies.json
          key: gemini-jar-${{ github.run_id }}

      - name: Restore Instagram session cache
        uses: actions/cache@v4
        with:
          path: automation/.session.json
          # Rolling key: a cache HIT skips the save, so a fixed key would
          # freeze the first snapshot forever. restore-keys picks the newest.
          key: ig-session-${{ github.run_id }}
          restore-keys: |
            ig-session-

      - name: Restore Instagram session from secret
        # The verified session lives in IG_SESSION_JSON so runners avoid
        # password logins (which trigger challenges).
        env:
          IG_SESSION_JSON: ${{ secrets.IG_SESSION_JSON }}
        run: |
          if [ -n "$IG_SESSION_JSON" ]; then
            printf '%s' "$IG_SESSION_JSON" > automation/.session.json
            echo "session restored from IG_SESSION_JSON secret"
          else
            echo "no IG_SESSION_JSON secret; using cache or password login"
          fi

      - name: Run content bot
        env:
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          IG_SESSION_JSON: ${{ secrets.IG_SESSION_JSON }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          # Free NIM models (probed 2026-10-03). Comma-separated lists allowed;
          # nemotron-3-super/mistral-nemotron/deepseek-v4-flash are 410 EOL.
          NVIDIA_MODEL: z-ai/glm-5.3-flash,openai/gpt-oss-20b
          NVIDIA_FALLBACK_MODEL: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
          # GEMINI_SID / GEMINI_TS come from the "Refresh Gemini cookies" step
          # ($GITHUB_ENV); the cookie chain keeps them fresh without a browser.
          GEMINI_CLI: ${{ github.workspace }}/automation/gemini-cli.py
          # Manual dispatch may override; scheduled runs go LIVE.
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          POST_TO_FEED: ${{ inputs.post_to_feed || 'true' }}
          POST_TO_STORY: ${{ inputs.post_to_story || 'true' }}
          ENGAGE: ${{ inputs.engage || 'true' }}
        run: .venv/bin/python automation/content_bot.py

      - name: Persist bookmark state
        run: |
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add automation/state.json
          git diff --cached --quiet || git commit -m "content-bot: update bookmarks [skip ci]"
          # --autostash: the run may leave ignored-but-modified files behind
          # (e.g. a chmod) and a bare rebase refuses to start.
          git pull --rebase --autostash origin main
          git push
